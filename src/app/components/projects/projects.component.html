<section id="projects" class="projects-section">
  <!-- Glowing Background Accent -->
  <div class="radial-bg accent-glow animate-float-delayed"></div>

  <div class="container projects-container">
    <!-- Section Title -->
    <div class="section-title-wrapper">
      <p class="section-tag">Enhanced Profile</p>
      <h2 class="section-title">My Projects</h2>
      <div class="section-divider"></div>
    </div>

    <!-- Filter Navigation Tabs -->
    <div class="filter-tabs">
      <button class="filter-btn" [class.active]="activeFilter === 'all'" (click)="filterProjects('all')">All
        Work</button>
      <button class="filter-btn" [class.active]="activeFilter === 'angular'" (click)="filterProjects('angular')">Angular
        & RxJS</button>
      <button class="filter-btn" [class.active]="activeFilter === 'ui'" (click)="filterProjects('ui')">UI/UX
        Design</button>
    </div>

    <!-- Project Cards Grid -->
    <div class="projects-grid">
      <div *ngFor="let project of filteredProjects" class="glass-card project-card">
        <div class="project-header">
          <!-- Folder Icon -->
          <div class="folder-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
            </svg>
          </div>
          <!-- Action Links Container (with hover confidentiality logic) -->
          <div class="project-actions">
            <div class="project-links">
              <a [href]="project.githubUrl" target="_blank" rel="noopener" aria-label="GitHub Repository"
                class="icon-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path
                    d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" />
                  <path d="M9 18c-4.51 2-5-2-7-2" />
                </svg>
              </a>
              <a [href]="project.liveUrl" target="_blank" rel="noopener" aria-label="Live Demo Link" class="icon-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                  <polyline points="15 3 21 3 21 9" />
                  <line x1="10" y1="14" x2="21" y2="3" />
                </svg>
              </a>
            </div>
            <!-- Hover Confidentiality Alert -->
            <span class="confidential-text">Private & Highly Confidential</span>
          </div>
        </div>

        <h3 class="project-title">{{ project.title }}</h3>
        <p class="project-desc">{{ project.description }}</p>

        <!-- Tags List -->
        <div class="project-tags">
          <span *ngFor="let tag of project.tags" class="tag-badge">{{ tag }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
