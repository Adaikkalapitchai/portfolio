<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <!-- Text / Symbol Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glassmorphic/Glow Ring -->
  <circle cx="256" cy="256" r="230" fill="#07090e" stroke="url(#bg-grad)" stroke-width="16" />
  
  <!-- Glowing background circle -->
  <circle cx="256" cy="256" r="190" fill="url(#bg-grad)" opacity="0.18" filter="url(#glow)" />
  
  <!-- Monogram AP Path -->
  <g filter="url(#glow)">
    <!-- Letter A -->
    <path d="M130 360 L200 170 L270 360" 
          fill="none" 
          stroke="url(#text-grad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <path d="M165 265 L235 265" 
          fill="none" 
          stroke="url(#text-grad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Letter P -->
    <path d="M295 360 L295 170 H345 C385 170 385 265 345 265 H295" 
          fill="none" 
          stroke="url(#text-grad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
